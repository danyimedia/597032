<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Career HQ</title>
<style>
:root { --page: #f2f4f7; --surface: #fcfdfe; --ink: #0e1320; --rule: #d9dfe7; --accent: #2e46c9; --accent-ink: #ffffff; --error: #b42318; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --page: #0b0e14; --surface: #161a22; --ink: #edf0f5; --rule: #2b3240; --accent: #93a5ff; --accent-ink: #0b0e14; --error: #ff8a80; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { width: min(320px, 100%); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 20px; }
form { display: grid; gap: 14px; }
#pw { font: inherit; width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--rule); background: var(--page); color: var(--ink); }
#pw.bad { border-color: var(--error); animation: nudge 0.3s; }
#pw.bad:focus-visible { outline-color: var(--error); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#remember { width: 17px; height: 17px; margin: 0; flex: none; accent-color: var(--accent); }
button { font: inherit; font-weight: 700; padding: 9px 22px; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button:disabled { opacity: 0.6; cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: 0.88rem; color: var(--error); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; }
@keyframes nudge { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { #pw.bad { animation: none; } }
</style>
</head>
<body>
<main class="card">
  <form id="login">
    <input class="vh" type="text" name="username" autocomplete="username" value="career-hq" tabindex="-1" aria-hidden="true">
    <input id="pw" type="password" name="password" autocomplete="current-password" aria-label="Password" required autofocus>
    <div class="row">
      <input id="remember" type="checkbox" aria-label="Remember on this device">
      <button id="go" type="submit">Open</button>
    </div>
    <div class="vh" id="msg" role="alert"></div>
  </form>
</main>

<script>
(function () {
  "use strict";
  var P = JSON.parse(document.getElementById("payload").textContent);
  var STORE = "careerhq.site.key";
  var form = document.getElementById("login"), pw = document.getElementById("pw"), remember = document.getElementById("remember");
  var go = document.getElementById("go"), msg = document.getElementById("msg");
  function bytes(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function text(u) { var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function saved() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function keep(v) { try { if (v) localStorage.setItem(STORE, v); else localStorage.removeItem(STORE); } catch (e) { /* storage blocked */ } }
  // Said out loud for screen readers; shown on the page only for a dead end the password cannot fix.
  function say(words, show) { msg.textContent = words; msg.className = show ? "note" : "vh"; }
  async function reveal(raw) {
    var key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    var html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv2) }, key, bytes(P.ct)));
    document.open(); document.write(html); document.close();
    document.documentElement.style.visibility = "";
  }
  async function unlock(password) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    var lock = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, lock, bytes(P.wk)));
  }
  if (!window.crypto || !crypto.subtle) { say("This browser can only open it over a secure (https) connection.", true); go.disabled = true; return; }
  if (/[?&]forget\b/.test(location.search)) { keep(null); history.replaceState(null, "", location.pathname); say("This device has forgotten the password.", false); }
  var remembered = saved();
  if (remembered) {
    // Wait until this page has finished parsing, or document.open() will not replace it.
    document.documentElement.style.visibility = "hidden";
    var start = function () { reveal(bytes(remembered)).catch(function () { keep(null); document.documentElement.style.visibility = ""; }); };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
  }
  pw.addEventListener("input", function () { pw.classList.remove("bad"); say("", false); });
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    pw.classList.remove("bad"); say("", false); go.disabled = true;
    var raw;
    try { raw = await unlock(pw.value); }
    catch (err) { go.disabled = false; pw.classList.add("bad"); say("That password does not open it.", false); pw.select(); return; }
    if (remember.checked) keep(text(raw));
    await reveal(raw);
  });
})();
